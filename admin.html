<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3864">
<title>KASE Class Scheduler</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .editing-banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 4px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .chip { border: 1px solid #b9c3d3; background: #fff; color: var(--navy); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-left: auto; font-weight: 400; margin-top: 0; }

  .group-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 4px; }
  .cls { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .cls:first-of-type { border-top: 0; }
  .cls .when { flex: 1; min-width: 0; }
  .cls .when b { display: block; }
  .cls .when span { font-size: 14px; color: var(--muted); }
  .badge { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
  .b-Gamma { background: #e6eefc; color: #1d4ea6; }
  .b-Delta { background: #e8f6ef; color: #18794e; }
  .b-Epsilon { background: #fbefe2; color: #9a4b0c; }
  .b-cancel { background: #eceef2; color: #6b7280; text-decoration: line-through; }
  .cls.cancelled .when b { color: var(--muted); text-decoration: line-through; }
  .confirm { background: var(--bad-bg); border-radius: 10px; padding: 10px 12px; margin: 4px 0 8px; font-size: 14px; color: var(--bad); }
  .confirm .actions { margin-top: 8px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">KASE Class Scheduler<small>Anveshana attendance</small></div>
  <div class="spacer"></div>
  <button class="link-btn" id="logoutBtn" hidden>Log out</button>
</header>

<main class="wrap">
  <section class="card" id="loginCard" hidden>
    <h2>Coordinator login</h2>
    <form id="loginForm">
      <label for="user">Username</label>
      <input type="text" id="user" autocomplete="username" autocapitalize="none" required>
      <label for="pass">Password</label>
      <input type="password" id="pass" autocomplete="current-password" required>
      <div class="msg" id="loginMsg" hidden></div>
      <div class="actions"><button class="btn block" id="loginBtn" type="submit">Log in</button></div>
    </form>
  </section>

  <div id="app" hidden>
    <section class="card" id="formCard">
      <div class="editing-banner" id="editBanner" hidden></div>
      <h2 id="formTitle">Schedule a class</h2>
      <form id="clsForm">
        <label>Batch</label>
        <div class="seg" id="batchSeg">
          <button type="button" data-v="Gamma">Gamma</button>
          <button type="button" data-v="Delta">Delta</button>
          <button type="button" data-v="Epsilon">Epsilon</button>
        </div>
        <label>Type</label>
        <div class="seg" id="typeSeg">
          <button type="button" data-v="Class">Class (2 hours)</button>
          <button type="button" data-v="Field">Field day</button>
        </div>
        <div class="grid2">
          <div><label for="date">Date</label><input type="date" id="date" required></div>
          <div id="startWrap"><label for="start">Start time</label><input type="time" id="start"></div>
        </div>
        <p class="hint" id="typeHint"></p>
        <div class="msg" id="formMsg" hidden></div>
        <div class="actions">
          <button class="btn" type="submit" id="saveBtn">Create class</button>
          <button class="btn secondary" type="button" id="stopEdit" hidden>Stop editing</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Classes</h2>
      <p class="muted" style="margin:-4px 0 12px">Each class appears in the attendance sheet on its day, as the first column after the student details.</p>
      <div class="filters" id="filters">
        <button class="chip" data-f="All" aria-pressed="true">All</button>
        <button class="chip" data-f="Gamma">Gamma</button>
        <button class="chip" data-f="Delta">Delta</button>
        <button class="chip" data-f="Epsilon">Epsilon</button>
        <label class="check"><input type="checkbox" id="showPast"> Past and cancelled</label>
      </div>
      <div id="list"><p class="muted">Loading…</p></div>
    </section>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
