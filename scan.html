<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<title>KASE Reception Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #7bd88f; flex: none; }
  .dot.off { background: #f2b84b; }
  .pill { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }

  .scanner { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 3; }
  .scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .guide { position: absolute; left: 8%; right: 8%; top: 30%; bottom: 30%; border: 3px solid rgba(255,255,255,.85); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.28); pointer-events: none; }
  .guide-text { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; text-align: center; padding: 16px; }

  .camctl { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .camctl .zoom { flex: 1; display: flex; align-items: center; gap: 10px; margin: 0; font-weight: 600; }
  .camctl .zoom input { flex: 1; accent-color: var(--navy); }
  #torchBtn[aria-pressed=true] { background: #ffd54a; border-color: #e0b400; color: #3a2a00; }
  .tip { font-size: 13px; color: var(--muted); margin: 8px 2px 0; line-height: 1.4; }
  .result { margin-top: 12px; border-radius: var(--radius); padding: 18px 16px; text-align: center; font-weight: 700; font-size: 22px; min-height: 84px; display: flex; flex-direction: column; justify-content: center; border: 2px solid var(--line); background: var(--card); color: var(--muted); }
  .result small { display: block; font-size: 15px; font-weight: 500; margin-top: 4px; }
  .result.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .result.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row .btn { flex: 1; }

  .recent { list-style: none; margin: 0; padding: 0; }
  .recent li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .recent li:first-child { border-top: 0; }
  .recent .roll { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
  .recent .st { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .recent .st.synced { color: var(--ok); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">KASE Reception<small id="clock"></small></div>
  <div class="spacer"></div>
  <div class="status" id="status" hidden>
    <span class="dot" id="netDot"></span>
    <span class="pill" id="pending">All synced</span>
  </div>
  <button class="link-btn" id="logoutBtn" hidden>Log out</button>
</header>

<main class="wrap">
  <!-- Login -->
  <section class="card" id="loginCard" hidden>
    <h2>Reception login</h2>
    <form id="loginForm" autocomplete="on">
      <label for="user">Username</label>
      <input type="text" id="user" autocomplete="username" autocapitalize="none" required>
      <label for="pass">Password</label>
      <input type="password" id="pass" autocomplete="current-password" required>
      <div class="msg" id="loginMsg" hidden></div>
      <div class="row"><button class="btn block" id="loginBtn" type="submit">Log in</button></div>
    </form>
  </section>

  <!-- Scanner -->
  <section id="scanCard" hidden>
    <div class="scanner">
      <video id="video" playsinline muted></video>
      <div class="guide" id="guide" hidden></div>
      <div class="guide-text" id="guideText" hidden>Hold the barcode inside the box. Tilt the card to avoid glare.</div>
      <div class="start" id="startPane">
        <button class="btn" id="startBtn">Start scanning</button>
        <div id="camMsg" style="font-size:14px;max-width:320px"></div>
      </div>
    </div>

    <div class="camctl" id="camCtl" hidden>
      <button class="btn secondary small" id="torchBtn" type="button" aria-pressed="false" hidden>Torch off</button>
      <label class="zoom" id="zoomWrap" hidden>Zoom <input type="range" id="zoom"></label>
    </div>

    <div class="result" id="result" role="status" aria-live="assertive">Ready to scan</div>

    <p class="tip">Scratched cover? Turn on the torch, zoom in and hold the card a little further away, or slide the card out of the cover.</p>

    <div class="row">
      <button class="btn secondary" id="manualBtn">Type roll number</button>
      <button class="btn secondary" id="syncBtn">Sync now</button>
    </div>

    <form class="card" id="manualForm" style="margin-top:12px" hidden>
      <label for="manualRoll">Roll number (if the barcode will not scan)</label>
      <input type="text" id="manualRoll" autocapitalize="characters" autocomplete="off" placeholder="e.g. 25QM1A0503">
      <div class="row">
        <button class="btn" type="submit">Save</button>
        <button class="btn secondary" type="button" id="manualCancel">Close</button>
      </div>
    </form>

    <div class="card" style="margin-top:16px">
      <h2>Recent scans</h2>
      <ul class="recent" id="recent"></ul>
      <p class="muted" id="recentEmpty">No scans yet.</p>
      <p class="muted" id="syncInfo"></p>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="scan.js"></script>
</body>
</html>
